# Daily: pull the latest agency releases, validate, re-run models, publish.
# GitHub-hosted runners have open internet access to NASA/NOAA/NSIDC endpoints.
name: Update data and forecasts
on:
  schedule:
    - cron: "17 6 * * *"     # 06:17 UTC daily; sources update monthly/weekly, unchanged files are not committed
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: update-data, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fetch, validate and model
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}   # optional; enables PO.DAAC copy of GMSL
        run: python -m pipeline.run --fetch --workers 2
      - run: python -m pytest -q tests
      - run: python -m pipeline.report
      - name: Build static site
        env: { API_BASE: "${{ vars.API_BASE }}" }
        run: python web/build_site.py
      - name: Commit refreshed data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/raw data/processed site docs
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  pages:
    needs: update
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
